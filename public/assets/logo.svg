<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE089" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#84590A" />
    </linearGradient>
    <linearGradient id="platinumGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#F9FAFB" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1221" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Diamond Frame -->
  <polygon points="200,24 350,110 350,290 200,376 50,290 50,110" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />
  <polygon points="200,40 334,118 334,282 200,360 66,282 66,118" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  
  <!-- Monogram SB -->
  <g font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Georgia', serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <text x="160" y="185" font-size="140" fill="url(#goldGrad)" filter="url(#goldGlow)" letter-spacing="-8">S</text>
    <text x="235" y="195" font-size="140" fill="url(#platinumGrad)" letter-spacing="-8">B</text>
  </g>
  
  <!-- Subtitle Bar -->
  <rect x="90" y="270" width="220" height="2" fill="url(#goldGrad)" />
  <polygon points="200,266 205,271 200,276 195,271" fill="#D4AF37" />
  
  <!-- SAIFEE BURHANI Text -->
  <text x="200" y="295" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">SAIFEE BURHANI</text>
  <text x="200" y="315" font-family="'Inter', 'Arial', sans-serif" font-size="10" font-weight="600" fill="#9CA3AF" text-anchor="middle" letter-spacing="6">GROUP OF COMPANIES</text>
</svg>
